name: historical ADP probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node <<'NODE'
          for(const suffix of ['', '?COUNT=500', '?COUNT=500&POS=*&ROOKIES=0']){
            const u='https://web.archive.org/web/20050806005351id_/http://football.myfantasyleague.com:80/2005/draft_analysis'+suffix;
            const h=await (await fetch(u)).text(), rows=[...h.matchAll(/<TR[^>]*>([\s\S]*?)<\/TR>/gi)].filter(m=>/\d+\.\d+/.test(m[1]));console.log(suffix||'default','bytes',h.length,'playerRows',rows.length,h.match(/Displaying Top[^<]*/i)?.[0]);
          }
          NODE
