name: historical ADP probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --max-time 10 -L -s 'https://www.fftoday.com/rankings/05_rankings_print.htm' -o /tmp/x
          grep -E '<tr' /tmp/x | grep -E 'class="(sort1|sort2|tablebody|bodycontent)' | head -80 || true
          grep -E 'Manning|Holmes|Tomlinson|Alexander|Owens|Gates' /tmp/x | head -40 || true
