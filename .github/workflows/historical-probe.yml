name: historical ADP probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for y in 2005 2006 2007; do
            yy=${y:2:2}
            echo "===== FFTODAY LINKS $y ====="
            curl --max-time 10 -L -s "https://www.fftoday.com/rankings/${yy}_index.html" | grep -Eoi 'href="[^"]*(adp|proj|rank|cheat)[^"]*"' | tail -50
          done
          echo '===== 2006 ADP SAMPLE ====='
          curl --max-time 10 -L -s 'https://www.fftoday.com/compiler/update/ADP.htm' | grep -E '<tr|<td' | head -80
