name: historical ADP probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for y in 2000 2001 2002 2003 2004 2005; do
            echo "==== $y ===="
            curl --max-time 12 -L -s "https://web.archive.org/cdx/search/cdx?url=football.myfantasyleague.com/$y/draft_analysis&output=json&filter=statuscode:200&filter=mimetype:text/html&from=$y&to=$((y+1))&limit=3" | head -c 1200
            echo
          done
