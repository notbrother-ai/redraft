name: historical ADP probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          u='https://web.archive.org/web/20050806005351id_/http://football.myfantasyleague.com:80/2005/draft_analysis'
          curl --max-time 25 -L -s "$u" -o /tmp/x
          echo bytes=$(wc -c </tmp/x)
          head -c 7000 /tmp/x
