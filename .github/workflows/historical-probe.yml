name: historical ADP probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for host in api.myfantasyleague.com www.myfantasyleague.com www44.myfantasyleague.com www48.myfantasyleague.com www54.myfantasyleague.com www57.myfantasyleague.com www61.myfantasyleague.com; do
            echo "==== $host ===="
            curl --max-time 6 -L -s -o /tmp/x -w 'HTTP=%{http_code} bytes=%{size_download} final=%{url_effective}\n' "https://$host/2005/draft_analysis"
            head -c 200 /tmp/x; echo
          done
