name: historical ADP probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for yy in 00 01 02 03 04 05 06 07; do
            for f in "${yy}_rankings_print.htm" "${yy}_adp.htm"; do
              u="https://www.fftoday.com/rankings/$f"
              code=$(curl --max-time 8 -L -s -o /tmp/x -w '%{http_code}' "$u")
              echo "$f HTTP=$code bytes=$(wc -c </tmp/x) rows=$(grep -c '<tr' /tmp/x || true)"
              grep -E '<td' /tmp/x | head -2 || true
            done
          done
