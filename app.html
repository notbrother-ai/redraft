<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RE:DRAFT — 2017</title><style>body{font-family:Arial;margin:0;background:#d9dde1;color:#213244}header{background:#20394f;color:#fff;padding:12px 18px;border-bottom:3px solid #e6a21a;font-weight:900;letter-spacing:2px}.wrap{max-width:1100px;margin:auto}.setup{background:#fff;border:1px solid #aab5bf;margin:14px 0;padding:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}select,button{padding:7px;border:1px solid #9ba7b3;background:#fff}button{background:#eda51e;font-weight:bold;cursor:pointer}.room{display:none;grid-template-columns:205px 1fr;background:#fff;border:1px solid #9faab5}.side{border-right:1px solid #b8c1ca}.head{background:#d9dfe5;padding:7px;font-size:10px;font-weight:bold;border-bottom:1px solid #b8c1ca}.slot{font-size:9px;padding:6px;border-bottom:1px solid #e0e4e7}.players{max-height:235px;overflow:auto}.player{display:grid;grid-template-columns:32px 1fr 42px 55px 85px;align-items:center;padding:3px 6px;min-height:38px;border-bottom:1px solid #e0e4e7;font-size:9px}.photo{width:27px;height:27px;background:#d7dde2;display:grid;place-items:center;font-weight:bold}.nm{font-weight:bold;color:#183b63}.star{font-size:17px;border:0;background:transparent;color:#d79716;padding:0}.draft{font-size:8px;padding:5px}.board{display:grid;grid-template-columns:repeat(10,1fr);min-width:700px}.pick{height:43px;border-right:1px solid #c5cdd4;border-bottom:1px solid #c5cdd4;padding:3px;font-size:8px}.mine{background:#fff3cf}.scroll{overflow:auto}.status{background:#253b50;color:#fff;padding:8px;font-size:11px}.queue{font-size:9px;padding:5px}.finish{display:none;background:#fff;border:1px solid #aab5bf;margin-top:12px;padding:15px}@media(max-width:800px){.wrap{padding:0 6px}.room{grid-template-columns:170px 760px;overflow:auto}}</style></head><body><header>RE:<span style="color:#55d49a">DRAFT</span> <small style="font-weight:normal;letter-spacing:0">2017 TIME MACHINE</small></header><div class="wrap"><section class="setup" id="setup"><b>Draft like it's 2017.</b><p style="font-size:11px;color:#667786">Draft against CPU managers anchored to historical preseason market value—not hindsight.</p><div class="controls"><select id="teams"><option>10</option><option selected>12</option></select><select id="slot"></select><select id="scoring"><option>PPR</option><option>Half PPR</option><option>Standard</option></select><button id="start">START DRAFT</button></div></section><section class="room" id="room"><aside class="side"><div class="head"><select id="rosterTeam"></select></div><div id="roster"></div><div class="head">QUEUE</div><div class="queue" id="queue">No queued players</div></aside><main><div class="status" id="status"></div><div class="head">AVAILABLE PLAYERS — ☆ QUEUE · DRAFT MAKES PICK</div><div class="players" id="players"></div><div class="head">DRAFT BOARD — CLICK TEAM COLUMN TO VIEW ROSTER</div><div class="scroll"><div class="board" id="board"></div></div></main></section><section class="finish" id="finish"><h2>2017 Draft Complete</h2><div id="report"></div><button onclick="location.reload()">NEW DRAFT</button></section></div><script>
const P=[['David Johnson','RB','ARI',1.3],['Le\'Veon Bell','RB','PIT',2],['Antonio Brown','WR','PIT',3.2],['Julio Jones','WR','ATL',3.8],['LeSean McCoy','RB','BUF',5.6],['Odell Beckham Jr.','WR','NYG',6.2],['Devonta Freeman','RB','ATL',7.2],['Melvin Gordon','RB','LAC',8.4],['Mike Evans','WR','TB',8.8],['A.J. Green','WR','CIN',11.4],['Jordy Nelson','WR','GB',12.4],['Jay Ajayi','RB','MIA',12.8],['Ezekiel Elliott','RB','DAL',13.8],['Jordan Howard','RB','CHI',14],['Michael Thomas','WR','NO',16.2],['Dez Bryant','WR','DAL',19.6],['Rob Gronkowski','TE','NE',19.6],['Amari Cooper','WR','OAK',24.2],['Doug Baldwin','WR','SEA',25.4],['Tom Brady','QB','NE',21.6],['Marshawn Lynch','RB','OAK',27.2],['T.Y. Hilton','WR','IND',28.4],['Isaiah Crowell','RB','CLE',29.6],['Christian McCaffrey','RB','CAR',27.2],['DeAndre Hopkins','WR','HOU',33.4],['Drew Brees','QB','NO',33],['Travis Kelce','TE','KC',37.2],['Joe Mixon','RB','CIN',39.6],['Keenan Allen','WR','LAC',42.8],['Dalvin Cook','RB','MIN',35],['Aaron Rodgers','QB','GB',35.6],['Ty Montgomery','RB','GB',44.6],['Michael Crabtree','WR','OAK',46.8],['C.J. Anderson','RB','DEN',47.2],['Allen Robinson','WR','JAX',48.6],['Tyreek Hill','WR','KC',49],['Greg Olsen','TE','CAR',47.4],['Jordan Reed','TE','WAS',50.8],['Kelvin Benjamin','WR','CAR',55],['Jimmy Graham','TE','SEA',55.4],['Larry Fitzgerald','WR','ARI',60],['Bilal Powell','RB','NYJ',60.6],['Martavis Bryant','WR','PIT',59.2],['Russell Wilson','QB','SEA',57.6],['Golden Tate','WR','DET',59.2],['Ameer Abdullah','RB','DET',65],['Stefon Diggs','WR','MIN',67.8],['Doug Martin','RB','TB',69.4],['Emmanuel Sanders','WR','DEN',67.8],['Mike Gillislee','RB','NE',66],['Sammy Watkins','WR','LAR',63.2],['Tevin Coleman','RB','ATL',67.6],['Kareem Hunt','RB','KC',45.8],['Cam Newton','QB','CAR',73.2],['Derek Carr','QB','OAK',77.4],['Jamison Crowder','WR','WAS',76.2],['Robert Kelley','RB','WAS',81.8],['Kyle Rudolph','TE','MIN',78],['Paul Perkins','RB','NYG',84.2],['Andrew Luck','QB','IND',84.8],['LeGarrette Blount','RB','PHI',82.6],['Zach Ertz','TE','PHI',92.4],['Pierre Garcon','WR','SF',92],['Eddie Lacy','RB','SEA',93.6],['Dak Prescott','QB','DAL',95.4],['Willie Snead','WR','NO',91.8],['Jeremy Maclin','WR','BAL',103.2],['Derrick Henry','RB','TEN',90.4],['Eric Decker','WR','TEN',99.6],['Jonathan Stewart','RB','CAR',103.6],['Hunter Henry','TE','LAC',115.2],['Matt Ryan','QB','ATL',93.8],['Ted Ginn Jr.','WR','NO',140.8],['Jamaal Williams','RB','GB',138.4],['Cooper Kupp','WR','LAR',150],['Matt Forte','RB','NYJ',121],['Darren McFadden','RB','DAL',109.2],['Philip Rivers','QB','LAC',118],['Jack Doyle','TE','IND',128.8],['Chris Hogan','WR','NE',117.8],['Corey Davis','WR','TEN',118.4],['John Brown','WR','ARI',124.6],['Adam Thielen','WR','MIN',125.8],['Kenny Britt','WR','CLE',125.8],['Eric Ebron','TE','DET',131.4],['Jacquizz Rodgers','RB','TB',133.8],['Rishard Matthews','WR','TEN',133.2],['Jared Cook','TE','OAK',178.5],['Julius Thomas','TE','MIA',178.8],['John Ross','WR','CIN',177.8],['Coby Fleener','TE','NO',163.8],['Joe Williams','RB','SF',162.5],['Marlon Mack','RB','IND',173.5]];
let n=12,user=0,pick=0,avail=[],rosters=[],queue=[],picks=[];const $=id=>document.getElementById(id);function initSlots(){let s=$('slot'),N=+$('teams').value;s.innerHTML=Array.from({length:N},(_,i)=>`<option value="${i}">Pick ${i+1}</option>`).join('')}initSlots();$('teams').onchange=initSlots;
function teamAt(i){let r=Math.floor(i/n),x=i%n;return r%2? n-1-x:x}function initials(x){return x.split(' ').map(y=>y[0]).slice(0,2).join('')}function start(){n=+$('teams').value;user=+$('slot').value;avail=P.map((x,i)=>({name:x[0],pos:x[1],team:x[2],adp:x[3],id:i}));rosters=Array.from({length:n},()=>[]);$('setup').style.display='none';$('room').style.display='grid';$('rosterTeam').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i}">${i===user?'MY ROSTER':'TEAM '+(i+1)}</option>`).join('');$('rosterTeam').value=user;$('rosterTeam').onchange=renderRoster;advance()}
function need(t,p){let c=rosters[t].filter(x=>x.pos===p).length;return ({QB:1,RB:4,WR:4,TE:2}[p]||1)-c}function cpu(t){let top=avail.slice(0,Math.min(18,avail.length));let scored=top.map(p=>({p,s:Math.abs(p.adp-(pick+1))+Math.random()*10-(need(t,p.pos)>0?5:0)})).sort((a,b)=>a.s-b.s);take(scored[0].p,t)}function take(p,t){if(!p)return;avail=avail.filter(x=>x.id!==p.id);rosters[t].push(p);picks.push({p,t});queue=queue.filter(x=>x.id!==p.id);pick++;render();advance()}function advance(){if(pick>=n*15||!avail.length){finish();return}if(teamAt(pick)!==user)setTimeout(()=>cpu(teamAt(pick)),45);else render()}
function render(){let mine=teamAt(pick)===user;$('status').textContent=`Round ${Math.floor(pick/n)+1} · Pick ${pick+1}/${n*15} ${mine?'— YOUR PICK':''}`;$('players').innerHTML=avail.slice(0,55).map(p=>`<div class="player"><div class="photo">${initials(p.name)}</div><div><div class="nm">${p.name}</div><small>${p.team} · ${p.pos}</small></div><div>${p.pos}</div><div>ADP ${p.adp}</div><div><button class="star" onclick="q(${p.id})">${queue.some(x=>x.id===p.id)?'★':'☆'}</button><button class="draft" ${mine?'':'disabled'} onclick="draft(${p.id})">DRAFT</button></div></div>`).join('');renderBoard();renderRoster();$('queue').innerHTML=queue.length?queue.map(x=>x.name).join('<br>'):'No queued players'}function draft(id){if(teamAt(pick)!==user)return;take(avail.find(x=>x.id===id),user)}function q(id){let p=avail.find(x=>x.id===id),i=queue.findIndex(x=>x.id===id);i>=0?queue.splice(i,1):queue.push(p);render()}
function renderBoard(){let cells=[];for(let i=0;i<n*15;i++){let r=Math.floor(i/n),display=r%2? n-(i%n):i%n+1,pk=picks[i];cells.push(`<div class="pick ${pk&&pk.t===user?'mine':''}" onclick="viewTeam(${pk?pk.t:(r%2?n-display:display-1)})"><b>${r+1}.${String(display).padStart(2,'0')}</b><br>${pk?pk.p.name:'—'}</div>`)}$('board').style.gridTemplateColumns=`repeat(${n},1fr)`;$('board').innerHTML=cells.join('')}function viewTeam(t){$('rosterTeam').value=t;renderRoster()}function renderRoster(){let t=+$('rosterTeam').value,r=rosters[t]||[];$('roster').innerHTML=r.length?r.map((p,i)=>`<div class="slot"><b>${p.pos}</b> — ${p.name}</div>`).join(''):'<div class="slot">No picks yet</div>'}function finish(){$('room').style.display='none';$('finish').style.display='block';let r=rosters[user],avg=r.reduce((a,p)=>a+(p.adp||0),0)/r.length;$('report').innerHTML=`<p><b>Your roster:</b> ${r.map(x=>x.name).join(', ')}</p><p><b>Average historical ADP:</b> ${avg.toFixed(1)}</p><p>This first public engine uses historical market anchors without season-result hindsight. Deeper grading and Time Machine Reveal are next.</p>`}$('start').onclick=start;
</script></body></html>
